[window]
dynamic_padding = true

opacity = 0.99

title = '#zsh'
dynamic_title = true

[window.dimensions]
columns = 120
lines = 34

[window.padding]
x = 13
y = 13

[scrolling]
history = 10000

[font]
size = 11.0

[font.bold]
family = 'FiraCode Nerd Font'
style = 'Bold'

[font.bold_italic]
family = 'JetBrainsMono Nerd Font Mono'
style = 'Bold Italic'

[font.italic]
family = 'JetBrainsMono Nerd Font Mono'
style = 'Italic'

[font.normal]
family = 'FiraCode Nerd Font'
style = 'Regular'


# github Alacritty Colors

# Default colors
[colors.primary]
background = '#24292e'
foreground = '#d1d5da'

# Normal colors
[colors.normal]
black   = '#586069'
red     = '#ea4a5a'
green   = '#34d058'
yellow  = '#ffea7f'
blue    = '#2188ff'
magenta = '#b392f0'
cyan    = '#39c5cf'
white   = '#d1d5da'

# Bright colors
[colors.bright]
black   = '#959da5'
red     = '#f97583'
green   = '#85e89d'
yellow  = '#ffea7f'
blue    = '#79b8ff'
magenta = '#b392f0'
cyan    = '#56d4dd'
white   = '#fafbfc'

[[colors.indexed_colors]]
index = 16
color = '#d18616'

[[colors.indexed_colors]]
index = 17
color = '#f97583'

[cursor]
style = {shape = 'Beam', blinking = 'On'}
vi_mode_style = { shape = "Block", blinking = "Off" }
